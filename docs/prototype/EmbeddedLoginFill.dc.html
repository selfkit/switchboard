<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; }
    a { text-decoration: none; }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: #FFFFFF;">

  <!-- 左侧极简导航条：常驻账号快切栏 -->
  <div style="width: 64px; flex-shrink: 0; background: #1D2129; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 14px;">
    <div style="width: 22px; height: 22px; border-radius: 6px; background: #0052D9; margin-bottom: 6px;"></div>
    <div title="阿里云 账号1 · 当前" style="width: 34px; height: 34px; border-radius: 9px; background: #0052D9; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #FFFFFF; box-shadow: 0 0 0 2px #1D2129, 0 0 0 3px #0052D9;">阿1</div>
    <a href="QuickSwitch.dc.html">
      <div style="width: 34px; height: 34px; border-radius: 9px; border: 1px dashed #4E5460; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #8A9099; margin-top: 4px;">+</div>
    </a>
  </div>

  <!-- 右侧：内嵌 WebView 容器 -->
  <div style="flex-grow: 1; display: flex; flex-direction: column;">

    <!-- 内嵌浏览器地址栏，说明这是App自己嵌的WebView，不是外部浏览器 -->
    <div style="height: 48px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: #F2F3F5; border-bottom: 1px solid #E5E6EB;">
      <div style="display: flex; gap: 6px;">
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #D4D6DB;"></div>
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #D4D6DB;"></div>
      </div>
      <div style="flex-grow: 1; padding: 6px 12px; border-radius: 6px; background: #FFFFFF; font-size: 12px; color: #4E5969; font-family: 'JetBrains Mono', ui-monospace, monospace;">ram.console.aliyun.com/login · 直播App - 推流服务</div>
      <div style="font-size: 11px; padding: 4px 8px; border-radius: 999px; background: rgba(227,77,89,0.08); color: #E34D59;">未检测到有效会话</div>
    </div>

    <!-- 模拟阿里云登录页 -->
    <div style="flex-grow: 1; position: relative; background: #F2F3F5; display: flex; align-items: center; justify-content: center;">
      <div style="width: 360px; background: #FFFFFF; border: 1px solid #E5E6EB; border-radius: 10px; padding: 28px; display: flex; flex-direction: column; gap: 16px;">
        <div style="font-size: 15px; color: #1D2129; font-weight: 500;">阿里云 RAM 用户登录</div>

        <div style="display: flex; flex-direction: column; gap: 6px; position: relative;">
          <label style="font-size: 12px; color: #4E5969;">账号</label>
          <input value="svc-live@company" readonly style="width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 6px; border: 1.5px solid #0052D9; background: rgba(0,82,217,0.08); font-size: 13px; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #1D2129;">
          <span style="position: absolute; right: 8px; top: 26px; font-size: 10px; color: #0052D9;">已自动填充</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px; position: relative;">
          <label style="font-size: 12px; color: #4E5969;">密码</label>
          <input value="••••••••••" readonly style="width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 6px; border: 1.5px solid #0052D9; background: rgba(0,82,217,0.08); font-size: 13px; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #1D2129;">
          <span style="position: absolute; right: 8px; top: 26px; font-size: 10px; color: #0052D9;">已自动填充</span>
        </div>

        <a href="EmbeddedSessionValid.dc.html"><button style="width: 100%; padding: 10px; border-radius: 7px; border: none; background: #0052D9; color: #FFFFFF; font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 500;">登录</button></a>
      </div>

      <!-- 填充失败时的兜底：手动指认输入框 -->
      <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1D2129; color: #FFFFFF; padding: 10px 16px; border-radius: 999px; font-size: 12px; display: flex; align-items: center; gap: 10px;">
        <span>如果填错了框</span>
        <a href="EmbeddedRefill.dc.html" style="color: #0052D9; text-decoration: underline;">点击手动选择输入框</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
