<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; }
    a { text-decoration: none; }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #F2F3F5; position: relative;">

  <div style="position: absolute; top: 48px; left: 64px; display: flex; align-items: center; gap: 10px;">
    <div style="width: 28px; height: 28px; border-radius: 8px; background: #0052D9;"></div>
    <span style="font-family: 'Inter', sans-serif; font-size: 20px; color: #1D2129;">Switchboard</span>
  </div>

  <div style="width: 460px; background: #FFFFFF; border: 1px solid #E5E6EB; border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 36px; height: 36px; border-radius: 999px; background: rgba(227,77,89,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <div style="width: 2px; height: 12px; background: #E34D59; margin-bottom: 2px;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; text-align: left;">
        <div style="font-family: 'Inter', sans-serif; font-size: 17px; color: #1D2129;">这个 Profile 的会话已过期</div>
        <div style="font-size: 12px; color: #4E5969;">腾讯云 · 主账号 · 30 天强制重新登录</div>
      </div>
    </div>

    <div style="background: #F2F3F5; border-radius: 8px; padding: 12px 14px; font-size: 12px; color: #4E5969; line-height: 1.6; text-align: left;">
      已经在隔离窗口里打开了登录页，浏览器会记住这次填写，之后不用重复输入
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; text-align: left;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 12px; color: #4E5969;">密码（已从本地记录自动填入）</label>
        <input type="password" value="••••••••••" readonly style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 7px; border: 1px solid #D4D6DB; background: #F2F3F5; font-size: 14px; font-family: 'Inter', sans-serif; color: #4E5969;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 12px; color: #4E5969;">本地动态验证码（30 秒内有效）</label>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 7px; border: 1px solid #0052D9; background: rgba(0,82,217,0.08);">
          <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 18px; letter-spacing: 3px; color: #1D2129;">482913</span>
          <span style="font-size: 11px; color: #0052D9;">点击复制</span>
        </div>
      </div>
    </div>

    <a href="Main.dc.html" style="width: 100%;">
      <button style="width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 8px; border: none; background: #0052D9; color: #FFFFFF; font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 500;">已在浏览器里完成登录，返回列表</button>
    </a>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

  renderVals() {
    return {};
  }
}
</script>
