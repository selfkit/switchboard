<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; }
    a { text-decoration: none; }
    label { font-size: 12px; color: #4E5969; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 7px; border: 1px solid #D4D6DB; background: #FFFFFF; font-size: 14px; font-family: 'Inter', sans-serif; color: #1D2129; }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; justify-content: center; background: #F2F3F5;">
  <div style="width: 640px; padding: 40px 0; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 24px; height: 24px; border-radius: 7px; background: #0052D9;"></div>
      <span style="font-family: 'Inter', sans-serif; font-size: 18px; color: #1D2129;">Switchboard</span>
    </div>

    <h1 style="margin: 0; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 24px; color: #1D2129;">新增账号</h1>
    <div style="font-size: 13px; color: #4E5969; margin-top: -12px;">每条记录会自动分配独立的浏览器 Profile，用于一键登录隔离</div>

    <div style="background: #FFFFFF; border: 1px solid #E5E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px;">

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label>平台</label>
          <select>
            <option>阿里云</option>
            <option>腾讯云</option>
            <option>即构</option>
            <option>微信小程序</option>
            <option>其他</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label>归属</label>
          <select>
            <option>公司账号</option>
            <option>个人账号</option>
          </select>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label>关联应用 / 项目</label>
        <input placeholder="例如：直播App - 推流服务">
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label>账号角色</label>
          <select>
            <option>主账号</option>
            <option>RAM子账号</option>
            <option>服务号</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label>登录名 / 邮箱</label>
          <input placeholder="svc-live@company.com">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label>登录直达 URL</label>
        <input placeholder="https://xxx.console.aliyun.com/...">
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label>密码（加密存储）</label>
          <input type="password" placeholder="••••••••">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label>TOTP 密钥（可选）</label>
          <input placeholder="Base32 密钥，绑定虚拟MFA时提供">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label>验证码联系人备注</label>
        <input placeholder="例如：财务-张三 手机尾号1234">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label>备注</label>
        <textarea rows="2" placeholder="其他说明"></textarea>
      </div>
    </div>

    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <a href="Main.dc.html"><button style="padding: 10px 18px; border-radius: 7px; border: 1px solid #D4D6DB; background: #FFFFFF; color: #4E5969; font-size: 14px; font-family: 'Inter', sans-serif;">取消</button></a>
      <a href="Main.dc.html"><button style="padding: 10px 18px; border-radius: 7px; border: none; background: #0052D9; color: #FFFFFF; font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 500;">保存</button></a>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
