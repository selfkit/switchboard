<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>Switchboard</title>
    <style>
      /* 调色板（src/ui.tsx 的 C 引用这些变量）。深色跟着系统外观走 */
      :root {
        color-scheme: light dark;
        --sb-ink: #323668; --sb-brand: #0052D9; --sb-brand-fill: #0052D9; --sb-brand-soft: rgba(0,82,217,0.08);
        --sb-text: #1D2129; --sb-sub: #4E5969; --sb-muted: #646E7D;
        --sb-border: #E5E6EB; --sb-border-strong: #D4D6DB; --sb-bg: #F2F3F5; --sb-surface: #FFFFFF;
        /* 正文危险色按白底 4.5:1 挑（#B42318 = 6.57）；按钮填充单独一套，白字 5.62 */
        --sb-danger: #B42318; --sb-danger-fill: #C62828;
        --sb-danger-border: rgba(180,35,24,0.3); --sb-danger-soft: rgba(180,35,24,0.08);
        --sb-success: #00875A; --sb-success-border: rgba(0,135,90,0.4); --sb-warn: #A15C00;
        --sb-warn-soft: rgba(161,92,0,0.08);
        --sb-scroll: rgba(0,0,0,0.16); --sb-scroll-hover: rgba(0,0,0,0.3);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sb-ink: #C5C8F5; --sb-brand: #6FA0FF; --sb-brand-fill: #2563EB; --sb-brand-soft: rgba(74,134,255,0.16);
          --sb-text: #E8E9EB; --sb-sub: #B8BCC4; --sb-muted: #8A919C;
          --sb-border: #333335; --sb-border-strong: #4A4A4D; --sb-bg: #17171A; --sb-surface: #232324;
          --sb-danger: #FF8A80; --sb-danger-fill: #B3261E;
          --sb-danger-border: rgba(255,138,128,0.34); --sb-danger-soft: rgba(255,138,128,0.12);
          --sb-success: #27C346; --sb-success-border: rgba(39,195,70,0.4); --sb-warn: #FF9A2E;
          --sb-warn-soft: rgba(255,154,46,0.12);
          --sb-scroll: rgba(255,255,255,0.18); --sb-scroll-hover: rgba(255,255,255,0.32);
        }
      }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif; background: var(--sb-bg); color: var(--sb-text); }
      a { text-decoration: none; }
      button { cursor: pointer; font: inherit; }
      input, select, textarea { font: inherit; }
      /*
        WKWebView 里默认是那种粗的、直接压在内容上的滚动条。统一换成细的、
        不滚就看不见的样式：styled 之后 WebKit 按经典滚动条排版，会自己让出 8px，
        不会再盖住右边的按钮和文字。
      */
      * { scrollbar-width: thin; scrollbar-color: var(--sb-scroll) transparent; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--sb-scroll); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--sb-scroll-hover); }
      /* 侧栏内容保持自然高度，让滚动容器承接溢出，避免小窗口压缩后截断。 */
      .sb-scroll > * { flex-shrink: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
