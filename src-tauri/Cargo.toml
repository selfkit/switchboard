[package]
name = "switchboard"
version = "0.1.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "switchboard_lib"
path = "src/lib.rs"

[[bin]]
name = "switchboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri-plugin-dialog = "2"
totp-rs = { version = "5", default-features = false }
time = { version = "0.3", features = ["local-offset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.0.0-rc.4"
tauri-plugin-process = "2.0.0-rc.1"
reqwest = "0.13.3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
# 下载文件名要从 URL 路径里解码出来（本来就在依赖树里，url 自己用的就是它）
percent-encoding = "2"

# 打包体积和可分析性：strip 掉符号表，LTO 把跨 crate 的边界也揉掉，
# 单 codegen unit + panic=abort 让产物更难对着符号读。
# 注意：这只是抬高门槛，机器码该反汇编还是能反汇编。
[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

# 只给测试用：校验 capabilities 里那几个 URL 模式真的能命中我们会打开的登录页
# （带端口的自建服务最容易被漏掉，见 lib.rs 的 session_capability_matches_real_login_urls）
[dev-dependencies]
tauri-utils = "2"
url = "2"
# capability 里 webviews 那几项就是 glob::Pattern（tauri-utils acl/resolved.rs），
# 测试里用同一个 crate 对一遍，别靠"应该能匹配吧"
glob = "0.3"
